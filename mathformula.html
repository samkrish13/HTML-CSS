<h1>IMPORTANT MATHS FORMULAE</h1>

<h3>Algebra:</h3>

<ol>
    <li>(a+b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup></li>
    <li>(a-b)<sup>2</sup> = a<sup>2</sup> - 2ab + b<sup>2</sup></li>
    <li>(a+b)(a-b) = a<sup>2</sup> - b<sup>2</sup></li>
</ol>
