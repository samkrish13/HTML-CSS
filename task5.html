<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Form</title>
</head>

<body>

<table border="0" width="40%" align="center" cellpadding="10" bgcolor="#1e2130">
    <tr bgcolor="#d88a00">
        <td colspan="2" align="left">
            <font size="5" color="white"><b>Sign Up</b></font>
        </td>
    </tr>
    <tr>
        <td><font color="#d8d85d"><b>First Name</b></font></td>
        <td><input type="text" placeholder="Enter First Name"></td>
    </tr>
    <tr>
        <td><font color="#d8d85d"><b>Last Name</b></font></td>
        <td><input type="text" placeholder="Enter Last Name"></td>
    </tr>
    <tr>
        <td><font color="#d8d85d"><b>Date of Birth</b></font></td>
        <td>
            <select><option>Date</option></select>
            <select><option>Month</option></select>
            <select><option>Year</option></select>
        </td>
    </tr>
    <tr>
        <td><font color="#d8d85d"><b>Gender</b></font></td>
        <td>
            <input type="radio" name="g"> Male
            <input type="radio" name="g"> Female
        </td>
    </tr>
    <tr>
        <td><font color="#d8d85d"><b>Country</b></font></td>
        <td>
            <select><option>Country</option></select>
        </td>
    </tr>
    <tr>
        <td><font color="#d8d85d"><b>E-mail</b></font></td>
        <td><input type="email" placeholder="Enter E-mail"></td>
    </tr>
    <tr>
        <td><font color="#d8d85d"><b>Phone</b></font></td>
        <td><input type="number" placeholder="Enter Phone"></td>
    </tr>
    <tr>
        <td><font color="#d8d85d"><b>Password</b></font></td>
        <td><input type="password"></td>
    </tr>
    <tr>
        <td><font color="#d8d85d"><b>Confirm Password</b></font></td>
        <td><input type="password"></td>
    </tr>
    <tr>
        <td colspan="2">
            <input type="checkbox"> 
            <font color="#d8d85d">I Agree to the Terms of use</font>
        </td>
    </tr>
    <tr bgcolor="#d88a00">
        <td align="center">
            <input type="submit" value="Submit" style="padding: 8px; background-color:#6dc06d;">
        </td>
        <td align="center">
            <input type="reset" value="Cancel" style="padding: 8px; background-color:#db4b4b;">
        </td>
    </tr>

</table>

</body>
</html>
