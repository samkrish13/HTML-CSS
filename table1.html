<!DOCTYPE html>
<html>
<head>
<title>Simple Time Table</title>
</head>
<body>
<h2>Time Table</h2>
<table border="1" cellpadding="8" cellspacing="0">
  <tr>
    <th>Hours</th>
    <th>Mon</th>
    <th>Tues</th>
    <th>Wed</th>
    <th>Thrus</th>
    <th>Fri</th>
  </tr>
  <tr>
    <td>1st Hour</td>
    <td>Science</td>
    <td>Maths</td>
    <td>Science</td>
    <td>Maths</td>
    <td>Arts</td>
  </tr>
  <tr>
    <td>2nd Hour</td>
    <td>Science</td>
    <td>Maths</td>
    <td>Science</td>
    <td>Maths</td>
    <td>Arts</td>
  </tr>
  <tr>
    <td colspan="6" align="center"><b>Lunch</b></td>
  </tr>
  <tr>
    <td>3rd Hour</td>
    <td>Science</td>
    <td>Maths</td>
    <td>Science</td>
    <td>Maths</td>
    <td>Project</td>
  </tr>
  <tr>
    <td>4th Hour</td>
    <td>Science</td>
    <td>Maths</td>
    <td>Science</td>
    <td>Maths</td>
    <td>Project</td>
  </tr>
</table>
</body>
</html>
