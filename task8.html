<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body style="background:#1a1a2e; font-family:Arial; color:#e6e600;">

    <div style="background:#cc8400; padding:10px;">
        <h2>Sign Up</h2>
    </div>

    <div style="padding:20px;">

        <label>First Name</label>
        <input type="text" placeholder="Enter First Name"><br><br>

        <label>Last Name</label>
        <input type="text" placeholder="Enter Last Name"><br><br>

        <label>Date of Birth</label>
        <select><option>Date</option></select>
        <select><option>Month</option></select>
        <select><option>Year</option></select><br><br>

        <label>Gender</label>
        <input type="radio" name="g"> Male
        <input type="radio" name="g"> Female<br><br>

        <label>Country</label>
        <select><option>Country</option></select><br><br>

        <label>E-mail</label>
        <input type="email" placeholder="Enter E-mail"><br><br>

        <label>Phone</label>
        <input type="text" placeholder="Enter Phone"><br><br>

        <label>Password</label>
        <input type="password"><br><br>

        <label>Confirm Password</label>
        <input type="password"><br><br>

        <input type="checkbox"> I Agree to the Terms of use <br><br>

        <button style="background:green; color:white; padding:8px;">Submit</button>
        <button style="background:red; color:white; padding:8px;">Cancel</button>

    </div>

</body>
</html>
