<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taks3</title>
</head>
<body>
    <h2>Fieldset Tag in HTML5</h2>
    <fieldset>
        <legend>Employee Details</legend>
        Employee ID:
        <input type="text" name="EmployeeID"><br><br>
        Employee FirstName:
        <input type="text" name="FirstName"><br><br>
        Employee LastName:
        <input type="text" name="LastName"><br><br>
        Employee Address:
        <input type="text" name="Address"><br><br>
    </fieldset>
    <fieldset>
        <legend>Programming Skills</legend>
        Programming Languages:
        <input type="text" name="Programming Languages"><br><br>
        <input type="checkbox" name="Languages" value="Python"> Python
        <input type="checkbox" name="Languages" value="Java"> Java
        <input type="checkbox" name="Languages" value="C++"> C++
        <input type="checkbox" name="Languages" value="JavaScript"> JavaScript<br><br>
    </fieldset>
</body>
</html>
