<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task4</title>
</head>
<body>
   
<center>
<table border="1" cellpadding="10" width="600" bgcolor="#00ccff">
    <tr>
        <th colspan="3" bgcolor="#ffffcc">
            <h2 style="color:red;">Registration Form</h2>
        </th>
    </tr>
    <tr>
        <td>Enter Name</td>
        <td colspan="2">
            <input type="text" size="40">
        </td>
    </tr>
    <tr>
        <td>Enter Password</td>
        <td colspan="2">
            <input type="password" size="40">
        </td>
    </tr>
    <tr>
        <td>Enter Address</td>
        <td colspan="2">
            <textarea rows="4" cols="38"></textarea>
        </td>
    </tr>
    <tr>
        <td>Select Game</td>
        <td colspan="2">
            <input type="checkbox"> Hockey <br>
            <input type="checkbox"> Football <br>
            <input type="checkbox"> Badminton <br>
            <input type="checkbox"> Cricket <br>
            <input type="checkbox"> Volleyball
        </td>
    </tr>
    <tr>
        <td>Gender</td>
        <td colspan="2">
            <input type="radio" name="g"> Male
            <input type="radio" name="g"> Female
        </td>
    </tr>
    <tr>
        <td>Select your age</td>
        <td colspan="2">
            <select>
                <option>Select</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
            </select>
        </td>
    </tr>
    <tr>
        <td>Select Photo</td>
        <td colspan="2">
            <input type="file">
        </td>
    </tr>
    <tr>
        <td colspan="3" align="center">
            <button>Click Me</button>
            <button type="reset">Reset</button>
            <button type="submit">Submit Form</button>
        </td>
    </tr>

</table>
</center>
</body>
</html>
