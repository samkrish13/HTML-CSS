<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task52</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="m-3">
    <p aria-hidden="true">
        <span class="placeholder col-6"></span>
    </p>
    <a class="btn btn-primary disabled placeholder col-4" aria-disabled="true"></a><br><br>
    <a class="btn btn-primary disabled placeholder col-4" aria-disabled="true">Lorem ipsum dolor sit amet consectetur adipisicing elit. Sunt, officia.</a><br><br>
    
    <h3>placeholder Card</h3>
    <div class="card" style="width: 18rem;">
    <div class="card-body">
      <h5 class="card-title placeholder-glow">
        <span class="placeholder col-6"></span>
      </h5>

      <p class="card-text placeholder-glow">
        <span class="placeholder col-7"></span><br>
        <span class="placeholder col-4"></span><br>
        <span class="placeholder col-5"></span>
      </p>

      <a class="btn btn-primary disabled placeholder col-6"></a>
    </div>
  </div>
    <h3>Placeholder different width property</h3>
    <span class="placeholder col-4"></span><br>
    <span class="placeholder w-50"></span><br>
    <span class="placeholder" style="width: 45%;"></span>

    <h3>placeholder Colors</h3>
    <span class="placeholder col-12 bg-primary"></span>
    <span class="placeholder col-12 bg-secondary"></span>
    <span class="placeholder col-12 bg-success"></span>
    <span class="placeholder col-12 bg-danger"></span>
    <span class="placeholder col-12 bg-warning"></span>
    <span class="placeholder col-12 bg-info"></span>
    <span class="placeholder col-12 bg-light text-dark">Lorem, ipsum dolor.</span>
    <span class="placeholder col-12 bg-dark"></span>

    <h3>Different sizes of placeholders using breakpoints</h3>
    <span class="placeholder col-12 placeholder-lg"></span>
    <span class="placeholder col-12"></span>
    <span class="placeholder col-12 placeholder-sm"></span>
    <span class="placeholder col-12 placeholder-xs"></span>

</body>
</html>
