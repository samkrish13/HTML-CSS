<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task51</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="m-4">
    <h3>Simple form controls</h3>
    <div>
        <label for="Input" class="form-label">Email address</label>
        <input type="email" class="form-control" id="Input" placeholder="name@example.com">
    </div>
    <div>
        <label for="TextArea" class="form-label">Address</label>
        <textarea class="form-control" id="TextArea" rows="3"></textarea>
    </div>
    
    <h3>form Controls</h3>
        <input class="form-control form-control-lg" type="text" placeholder="large size">
        <input class="form-control" type="text" placeholder="Default size">
        <input class="form-control form-control-sm" type="text" placeholder="small size">
        <br><br>

    <h3>Disabled and Readonly examples</h3>
        <input class="form-control" type="text" placeholder="Disabled example" aria-label="Disabled input example" disabled>
        <input class="form-control" type="text" value="Disabled readonly input" aria-label="Disabled input example" disabled readonly>
        <input class="form-control" type="text" value="Readonly input here..." aria-label="readonly input example" readonly>
        <br><br>

    <div class="row">
        <label for="staticEmail" class="col-sm-2 col-form-label">Email</label>
        <div class="col-sm-10">
            <input type="text" readonly class="form-control-plaintext" id="staticEmail" value="email@example.com">
        </div>
    </div>
    <div class="row">
        <label for="inputPassword" class="col-sm-2 col-form-label">Password</label>
        <div class="col-sm-10">
            <input type="password" class="form-control" id="inputPassword">
        </div>
    </div><br><br>

    <form class="row g-3">
        <div class="col-auto">
            <label for="staticEmail2" class="visually-hidden">Email</label>
            <input type="text" readonly class="form-control-plaintext" id="staticEmail2" value="email@example.com">
        </div>
        <div class="col-auto">
            <label for="inputPassword2" class="visually-hidden">Password</label>
            <input type="password" class="form-control" id="inputPassword2" placeholder="Password">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary mb-3">Confirm</button>
        </div>
    </form><br><br>

    <div>
        <label for="formFile" class="form-label">Default file input example</label>
        <input class="form-control" type="file" id="formFile">
    </div><br>
    <div>
        <label for="formFileMultiple" class="form-label">Multiple files input example</label>
        <input class="form-control" type="file" id="formFileMultiple" multiple>
    </div><br>
    <div>
        <label for="formFileDisabled" class="form-label">Disabled file input example</label>
        <input class="form-control" type="file" id="formFileDisabled" disabled>
    </div><br>
    <div>
        <label for="formFileSm" class="form-label">Small file input example</label>
        <input class="form-control form-control-sm" id="formFileSm" type="file">
    </div><br>
    <div>
        <label for="formFileLg" class="form-label">Large file input example</label>
        <input class="form-control form-control-lg" id="formFileLg" type="file">
    </div> <br>
        
</body>
</html>
